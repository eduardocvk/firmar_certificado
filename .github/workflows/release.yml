name: Publicar preversión
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recuperar compilación verificada del mismo commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$GITHUB_SHA&per_page=20" --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")][0].id')
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No hay compilación de main para el commit de esta etiqueta."
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 30
          gh run download "$run_id" --name FirmaVisible-Windows --dir packages/windows
          gh run download "$run_id" --name FirmaVisible-Android-pruebas --dir packages/android
          cp packages/android/android-debug.apk packages/FirmaVisible-Android.apk
          cp packages/windows/FirmaVisible-Windows.zip packages/FirmaVisible-Windows.zip
      - name: Crear preversión con las aplicaciones
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          sha256sum FirmaVisible-Android.apk FirmaVisible-Windows.zip > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" packages/FirmaVisible-Android.apk packages/FirmaVisible-Windows.zip packages/SHA256SUMS.txt --verify-tag --prerelease --title "FirmaVisible $GITHUB_REF_NAME · pruebas" --notes-file docs/NOTAS_VERSION.md
