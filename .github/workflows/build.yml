name: Compilar y comprobar
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pruebas C#, CMS y visor nativo de Windows
        env:
          FIRMAVISIBLE_LIVE_TSA: 'true'
        shell: pwsh
        run: dotnet run --project windows/FirmaVisible.Tests/FirmaVisible.Tests.csproj -c Release -- artifacts/windows-tests
      - name: Verificación CMS independiente con OpenSSL
        shell: pwsh
        run: |
          ./scripts/verify-openssl.ps1 -Artifacts artifacts/windows-tests
          ./scripts/verify-timestamp.ps1 -Artifacts artifacts/windows-tests
      - name: Publicar aplicación con .NET incluido
        shell: pwsh
        run: ./scripts/Build-Windows.ps1
      - name: Comprobar arranque del ejecutable publicado
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path artifacts/windows/FirmaVisible/FirmaVisible.exe) -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "Error de arranque: $($app.ExitCode)" }
      - name: Validar empaquetado para Store con identidad de prueba
        shell: pwsh
        run: ./scripts/New-StorePackage.ps1 -IdentityName FirmaVisible.ValidationOnly -Publisher 'CN=ValidationOnly' -PublisherDisplayName 'Validation only'
      - name: Comprimir aplicación
        shell: pwsh
        run: Compress-Archive -Path artifacts/windows/FirmaVisible -DestinationPath FirmaVisible-Windows-NET.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FirmaVisible-Windows-NET
          path: FirmaVisible-Windows-NET.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-windows
          path: artifacts/windows-tests/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK y análisis estático
        env:
          FIRMAVISIBLE_LIVE_TSA: 'true'
        run: bash ./gradlew -PwithAndroid=true :pdf:test :android:assembleDebug :android:assembleAndroidTest :android:lintDebug --no-daemon
      - name: Verificación independiente del CMS y sello real
        shell: pwsh
        run: |
          ./scripts/verify-openssl.ps1
          ./scripts/verify-timestamp.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FirmaVisible-Android-pruebas
          path: android/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analisis-android
          path: |
            android/build/reports/lint-results-debug.html
            pdf/build/reports/tests/
            pdf/build/test-artifacts/
  android-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Permitir aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash ./gradlew -PwithAndroid=true :android:connectedDebugAndroidTest --no-daemon; result=$?; adb pull /sdcard/Pictures/FirmaVisibleTests android/build/preview-test || true; adb pull /sdcard/Download/FirmaVisibleTests android/build/pdf-test || true; exit $result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-emulador-android
          path: |
            android/build/reports/androidTests/
            android/build/preview-test/
            android/build/pdf-test/
